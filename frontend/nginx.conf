server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Dashboard interno: não deve aparecer em buscador nem em iframe de terceiro.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets do Vite trazem hash no nome, então podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca é cacheado — é ele que aponta para o bundle novo após deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota do react-router cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
