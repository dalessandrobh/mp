# Deploy na VPS onde JÁ existem n8n, Supabase self-hosted e o proxy do Coolify.
#
# Sobe DOIS serviços: o backend (FastAPI) e o frontend (bundle estático em nginx).
# Não sobe Postgres (usa o do Supabase) e não sobe n8n (você já tem).
#
# Nenhum dos dois publica porta no host. Quem os alcança é o Traefik do Coolify,
# pela rede Docker — de propósito: a porta 8000 do host já é do próprio Coolify,
# e publicar ali derrubaria o painel.
#
# Frontend e backend ficam no MESMO domínio, separados por path:
#   https://mp.dsearch.com.br/          -> frontend (dashboard)
#   https://mp.dsearch.com.br/api/v1/*  -> backend (API autenticada)
#   https://mp.dsearch.com.br/go/*      -> backend (redirect público que conta o clique)
#   https://mp.dsearch.com.br/l         -> backend (página pública "link na bio")
#   https://mp.dsearch.com.br/robots.txt-> backend (nega indexação de /go e /l)
# Mesma origem significa nenhum CORS para manter e um só certificado.
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d

# Nome do projeto: prefixa recursos criados aqui, separando-os do que o Coolify gerencia.
name: mp

services:
  backend:
    build:
      context: ../backend
    container_name: mp-backend
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - supabase   # onde vive o Postgres do Supabase
      - proxy      # onde vivem o Traefik e o n8n
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;
             urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}

      # HTTP só existe para o desafio do Let's Encrypt e para mandar todo mundo
      # para o HTTPS. Nada de aplicação trafega em claro.
      # Path exato em /l e /robots.txt (e /l/ para listas temáticas futuras): PathPrefix(`/l`)
      # cru casaria /login e qualquer rota do dashboard que comece com "l".
      traefik.http.routers.mp-api-http.rule: Host(`${MP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/go/`) || Path(`/l`) || PathPrefix(`/l/`) || Path(`/robots.txt`) || Path(`/privacidade`) || Path(`/biopinterest`) || Path(`/biopinterest/`))
      traefik.http.routers.mp-api-http.entrypoints: http
      traefik.http.routers.mp-api-http.middlewares: redirect-to-https
      traefik.http.routers.mp-api-http.priority: "100"

      # Prioridade maior que a do frontend: /api precisa ganhar de /.
      traefik.http.routers.mp-api.rule: Host(`${MP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/go/`) || Path(`/l`) || PathPrefix(`/l/`) || Path(`/robots.txt`) || Path(`/privacidade`) || Path(`/biopinterest`) || Path(`/biopinterest/`))
      traefik.http.routers.mp-api.entrypoints: https
      traefik.http.routers.mp-api.priority: "100"
      traefik.http.routers.mp-api.tls: "true"
      traefik.http.routers.mp-api.tls.certresolver: letsencrypt
      traefik.http.routers.mp-api.service: mp-api
      traefik.http.services.mp-api.loadbalancer.server.port: "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: mp-frontend
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      # 127.0.0.1 e não "localhost": no Alpine o localhost resolve para ::1 e o nginx só escuta IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}

      traefik.http.routers.mp-front-http.rule: Host(`${MP_DOMAIN}`)
      traefik.http.routers.mp-front-http.entrypoints: http
      traefik.http.routers.mp-front-http.middlewares: redirect-to-https
      traefik.http.routers.mp-front-http.priority: "10"

      traefik.http.routers.mp-front.rule: Host(`${MP_DOMAIN}`)
      traefik.http.routers.mp-front.entrypoints: https
      traefik.http.routers.mp-front.priority: "10"
      traefik.http.routers.mp-front.tls: "true"
      traefik.http.routers.mp-front.tls.certresolver: letsencrypt
      traefik.http.routers.mp-front.middlewares: gzip
      traefik.http.routers.mp-front.service: mp-front
      traefik.http.services.mp-front.loadbalancer.server.port: "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Rede do Postgres do Supabase. Descubra o nome com:
  #   docker inspect <container-do-postgres> \
  #     -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
  supabase:
    external: true
    name: ${SUPABASE_NETWORK}

  # Rede onde o Traefik do Coolify enxerga containers (e onde está o n8n).
  proxy:
    external: true
    name: ${PROXY_NETWORK}
